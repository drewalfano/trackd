<!doctype html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <title>Trackd</title>
    <meta name="description" content="Trackd. Personal macro tracking, local first, works offline." />

    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" href="%BASE_URL%icons/icon-192.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />

    <!-- Matched to the app background, per spec 8. Swapped at runtime for dark. -->
    <meta name="theme-color" content="#F0F0F0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Macros" />
    <!--
      The pairing `viewport-fit=cover` needs. `default` insets the web view below
      an opaque status bar, which on a notched device leaves the layout extending
      up while `env(safe-area-inset-top)` reports 0 — so the inset `.screen`
      already asks for never fires. `black-translucent` puts the content under
      the status bar and makes that inset real.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />

    <script>
      // Applied before first paint so an installed dark-mode launch never flashes light.
      try {
        var t = localStorage.getItem('mt:theme') || 'system'
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    <noscript>Trackd needs JavaScript. All of it runs on your device.</noscript>
  </body>
</html>
