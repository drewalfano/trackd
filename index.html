<!doctype html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <title>Trackd</title>
    <meta name="description" content="Trackd. Personal macro tracking, local first, works offline." />

    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" href="%BASE_URL%icons/icon-192.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />

    <!-- Matched to the app background, per spec 8. Swapped at runtime for dark. -->
    <meta name="theme-color" content="#F0F0F0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Macros" />
    <!--
      `default`, and this is the line that caused the bottom-of-the-screen bug.

      It was `black-translucent` for two days, changed in 8b524bb on the reasoning
      that `default` insets the web view below an opaque status bar, so
      `env(safe-area-inset-top)` reports 0 and the inset `.screen` asks for never
      fires. That commit said UNVERIFIED ON DEVICE, and this is what it cost.

      `black-translucent` puts the content under the status bar, and WebKit then
      reports a LAYOUT viewport of the screen less the top inset — 812 against a
      874 screen on Drew's 17 Pro — while the web view still covers all 874.
      Everything anchored to the bottom then depends on which of those two heights
      WebKit feels like using, and it does not use one consistently: on a
      scrollable screen `bottom: 0` and `100dvh` resolve to 874, on a screen with
      nothing to scroll they collapse to 812. Hence a tab bar that rode up only on
      days with nothing logged, and sheets that stopped 62px short.

      The inset it was reaching for is not needed under `default`: iOS has already
      moved the web view below the status bar, so `0 + 20px` IS the right top
      padding and `.screen`'s existing calc produces it. The trade is the status
      bar's own appearance, which `theme-color` and lib/statusBar.js drive — that
      pairing works better here than under `black-translucent`, which forces white
      glyphs and is wrong over the light theme.

      Keep this as `default`. `--screen-h` in styles.css hardens the app against
      the short layout viewport either way, but this is the cause.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />

    <script>
      // Applied before first paint so an installed dark-mode launch never flashes light.
      try {
        var t = localStorage.getItem('mt:theme') || 'system'
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    <noscript>Trackd needs JavaScript. All of it runs on your device.</noscript>
  </body>
</html>
