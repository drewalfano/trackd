name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# HTTPS is not optional here: getUserMedia will not run on plain HTTP, so
# barcode scanning only works because Pages serves over TLS.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Build
        run: npm run build
        env:
          # Must match the repository name, since Pages serves from a subpath.
          BASE_PATH: /macro-tracking-app/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
